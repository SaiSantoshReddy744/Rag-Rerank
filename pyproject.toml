[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-rag-system"
version = "1.1.0"
description = "Knowledge Vault: Local-first PDF RAG engine for modular AI systems."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "python-dotenv>=1.0,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "httpx>=0.27,<1.0",
  "PyMuPDF>=1.24,<2.0",
  "qdrant-client>=1.10,<2.0",
  "sentence-transformers>=3.0,<4.0",
  "tiktoken>=0.7,<1.0",
  "torch==2.14.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
  "mypy>=1.11,<2.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.6,<1.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "eval*", "benchmarks*"]

[project.scripts]
pdf-rag-eval = "eval.evaluate:main"
pdf-rag-analyze-reranker = "eval.analyze_reranker:main"
pdf-rag-export-chunks = "eval.export_chunks:main"
pdf-rag-benchmark = "benchmarks.retrieval_benchmark:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "C4", "TID"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/m1_eval.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "fitz",
  "qdrant_client",
  "qdrant_client.*",
  "sentence_transformers",
  "sentence_transformers.*",
  "tiktoken",
]
ignore_missing_imports = true