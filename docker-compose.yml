services:
  qdrant:
    image: qdrant/qdrant:v1.18.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  app:
    build: .
    depends_on:
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      QDRANT_URL: http://qdrant:6333
      GENERATION_PROVIDER_URL: http://host.docker.internal:4000/v1/generate
      DATA_DIR: /app/data
      EMBEDDING_DEVICE: cpu
      RE_RANK_ENABLED: "true"
      RE_RANK_MODEL_NAME: BAAI/bge-reranker-base
      RERANK_CANDIDATE_K: "20"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - app_data:/app/data

volumes:
  qdrant_storage:
  app_data:
